<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="manus-game-loading-screen" content="1">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    @font-face { font-family: "PongArabic"; font-style: normal; font-weight: 400; src: url("data:font/ttf;base64,") format("truetype"); }
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans Arabic", sans-serif; background: #040712; color: #e8f7ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #040712; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 15px; padding: 24px; text-align: center; background: radial-gradient(circle at 78% 16%, #123b4b 0, #080d22 34%, #040712 72%, #02030a 100%); }
    #loading::before, #loading::after { content: ""; position: fixed; pointer-events: none; }
    #loading::before { inset: 10%; border: 1px solid #42f5ff44; border-radius: 26px; box-shadow: 0 0 90px #42f5ff22 inset, 0 0 40px #8b6cff18; }
    #loading::after { width: 18px; height: 18px; border-radius: 50%; left: 12%; top: 24%; background: #ff4fb3; box-shadow: 0 0 24px #ff4fb3; }
    #loading[hidden], [hidden] { display: none; }
    #loading > * { position: relative; z-index: 1; }
    .eyebrow { color: #42f5ff; font-size: 13px; letter-spacing: .22em; }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 64px); letter-spacing: .04em; }
    p { margin: 0; color: #8399bd; line-height: 1.7; }
    progress { width: min(360px, 75vw); height: 10px; accent-color: #42f5ff; justify-self: center; filter: drop-shadow(0 0 8px #42f5ff88); }
    button { justify-self: center; padding: 10px 24px; border: 1px solid #42f5ff88; border-radius: 10px; background: #0a1226; color: #e8f7ff; cursor: pointer; font: inherit; box-shadow: 0 0 18px #42f5ff18; }
    button:hover { background: #172c4d; border-color: #ff4fb3; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">مرورگر شما از canvas پشتیبانی نمی‌کند.</canvas>
  <section id="loading" role="status" aria-live="polite">
    <div class="eyebrow">ARCADE // 22#$</div>
    <h1 id="game-title">Pong 22#$</h1>
    <p id="loading-status">در حال بارگذاری بازی…</p>
    <progress id="loading-progress" aria-label="پیشرفت بارگذاری"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>تلاش دوباره</button>
    <noscript>برای اجرای بازی، JavaScript را فعال کنید.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      document.title = 'Pong 22#$';
      document.documentElement.lang = 'fa';
      status.textContent = 'در حال بارگذاری بازی…';
      retry.textContent = 'تلاش دوباره';
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 30000
          ? 'پیشرفت تازه‌ای دیده نشد؛ می‌توانید صبر کنید یا دوباره تلاش کنید.'
          : 'بازی هنوز در حال بارگذاری است؛ لطفاً کمی صبر کنید.';
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[pong-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = 'بارگذاری بازی انجام نشد. دوباره تلاش کنید.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = 'در حال بارگذاری…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'در حال آماده‌سازی زمین بازی…' : `${Math.floor(current / total * 100)}٪`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
